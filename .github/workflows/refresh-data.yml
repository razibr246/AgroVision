# Daily data refresh: re-fetch every dataset whose source keeps publishing (NASA POWER, MODIS, GRACE/SMAP, DAM
# prices, Sentinel field watch, rain onset), retrain the stress model and the Chakra knowledge base, run the tests and
# the build, and open a pull request with the new data. Nothing reaches the live site until the PR is merged.
# The same steps run by hand with: bash scripts/refresh-data.sh   (add "full" for the long MODIS pulls)
name: Refresh data

on:
  schedule:
    - cron: '30 21 * * *'   # every day 21:30 UTC = 03:30 in Dhaka
  workflow_dispatch:
    inputs:
      full:
        description: 'Also run the long MODIS per-field and South Asia trend pulls (about 1 hour)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install pypdf certifi

      - name: Refresh and retrain
        id: refresh
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        continue-on-error: true
        run: bash scripts/refresh-data.sh ${{ inputs.full && 'full' || '' }}

      - name: Tests and build must pass on the new data
        run: npm test && npm run build

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src public services; then echo "No data changed."; exit 0; fi
          branch="data/refresh-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src public services
          git commit -m "Refresh data $(date -u +%Y-%m-%d): NASA POWER, MODIS, GRACE/SMAP, prices, onset; retrain models (generated data)"
          git push -u origin "$branch"
          {
            echo "Daily data refresh. Generated data only; tests and build passed on it."
            echo
            echo '```'
            cat .cache/refresh/status.log
            echo '```'
            echo
            git diff --stat HEAD~1 | tail -1
          } > body.md
          gh pr create --title "Data refresh $(date -u +%Y-%m-%d)" --body-file body.md
